name: Docker Image CI

on:
  push:
    branches: [master, deploy]
  pull_request:
    branches: [master, deploy]
  workflow_dispatch:
  schedule: # monthly builds
    - cron: "0 2 2 * *"

jobs:
  build_push_to_registry:
    name: Build/Push Docker Image to GitHub Container Registry (ghcr.io)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore Docker build cache
        # Use a stable key based on the branch/ref and Dockerfile contents so
        # the cache is reused across retries and only invalidated when Dockerfile changes
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.ref }}-${{ hashFiles('**/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{ version }}
            # dynamically set the branch name as a prefix
            type=sha,prefix=${{ env.BRANCH_NAME }}-
            # dynamically set the branch name
            type=raw,value=${{ env.BRANCH_NAME }}-latest
            # set the latest branch name
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use GitHub Actions cache backend for buildx so the cache is persisted
          # across workflow runs and job restarts (type=gha)
          cache-from: type=gha
          cache-to: type=gha,mode=max
